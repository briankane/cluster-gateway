# Image of the cluster-gateway instances
image: oamdev/cluster-gateway

tag:

# Number of replicas
replicas: 1
# A secured namespace for reading cluster secrets
secretNamespace: open-cluster-management-credentials

ocmIntegration:
  enabled: false
  clusterProxy:
    enabled: false
    endpoint:
      host: proxy-entrypoint.open-cluster-management-cluster-proxy
      port: 8090

featureGate:
  healthiness: false
  secretCache: false
# Credential plugins mint short-lived credentials for clusters registered with the
# Provider credential type. Each runs as a sidecar and serves a unix socket in a
# volume shared with the gateway. Cloud identity is mounted into the plugin
# container only.
credentialPlugins:
  # Group that owns the plugin sockets (pod fsGroup); plugins and the gateway share it.
  fsGroup: 65532
  aws:
    enabled: false
    image: oamdev/cluster-gateway-plugin-aws
    # Defaults to the chart version.
    tag:
    # Region for the plugin's own STS calls (IRSA web identity exchange, AssumeRole).
    region: ""
    irsa:
      # Role the plugin assumes with its projected ServiceAccount token. The
      # ServiceAccount is deliberately not annotated, so the EKS webhook does not
      # inject this identity into the gateway container.
      roleArn: ""
    podIdentity:
      # Use an EKS Pod Identity association for this release's ServiceAccount.
      # The association itself is created in EKS, not by this chart.
      enabled: false
    # Sign for clusters without a roleArn using the plugin's own identity (the
    # IRSA or Pod Identity role above). Off: each cluster assumes its own role.
    allowBaseIdentity: false
    # Roles a cluster's provider-config may name as roleArn. {cluster} in a role
    # name matches only the requesting ClusterGateway's name, so a cluster cannot
    # use another cluster's role, e.g.
    #   - arn:aws:iam::222222222222:role/vela-{cluster}
    allowedRoleArns: []
    # Prefix of the RoleSessionName, which is <sessionName>-<cluster>.
    sessionName: cluster-gateway
    resources: {}
  # Further plugins, each a container spec run as a sidecar. The socket volume is
  # mounted at /var/run/cluster-gateway/plugins; a plugin named <provider> must
  # listen on <provider>.sock there. For example:
  #   - name: credential-plugin-acme
  #     image: example.com/acme-credential-plugin:v1
  #     args: ["--socket=/var/run/cluster-gateway/plugins/acme.sock"]
  custom: []
  # Extra pod volumes for custom plugins.
  volumes: []
  # Setup templates for custom plugins, keyed by provider name: CUE that renders
  # providerConfig and setup steps from `vela cluster setup/join --param` values.
  templates: {}
